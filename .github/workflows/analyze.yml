# 手動：バックテストだけを回す（データベースは読むだけで保存しないので、予想のリレーと同時に動かしてよい）
name: analyze (backtest only)
on:
  workflow_dispatch:
    inputs:
      test_from: { description: "バックテスト開始日 YYYYMMDD", required: true, default: "20260724" }
permissions: { contents: write }
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { PYTHONPATH: src, TZ: Asia/Tokyo, PYTHONWARNINGS: ignore }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && mkdir -p docs/data/logs
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-analyze-${{ github.run_id }}
          restore-keys: boatev-db-
      - run: python -m boatev.cli backtest --test-from ${{ inputs.test_from }} 2>&1 | tail -n 300 > docs/data/logs/analyze.log
      - name: commit
        run: |
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data/backtest.json docs/data/logs/analyze.log && git commit -m "analyze report" || exit 0
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done; exit 1
