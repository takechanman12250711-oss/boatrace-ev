# 手動：DBの取込状況を docs/data/status.json に書き出す
name: status
on: { workflow_dispatch: {} }
concurrency: { group: boatev-db, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  status:
    runs-on: ubuntu-latest
    env: { PYTHONPATH: src, TZ: Asia/Tokyo }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && mkdir -p docs/data/logs && echo "=== $(date "+%F %T") ${{ github.workflow }} run ${{ github.run_id }}" >> docs/data/logs/status.log
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-status-${{ github.run_id }}
          restore-keys: boatev-db-
      - run: python -m boatev.cli status 2>&1 | tee -a docs/data/logs/status.log
      - name: commit
        if: always()
        run: |
          tail -n 400 docs/data/logs/status.log > /tmp/l && mv /tmp/l docs/data/logs/status.log
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data && git commit -m "status" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done; echo "push failed"; exit 1
