# 過去オッズの補完（手動）。1回あたり約5時間で打ち切り、再実行すると続きから取る
name: backfill odds
on:
  workflow_dispatch:
    inputs:
      from: { description: "開始日 YYYYMMDD", required: true, default: "20220101" }
      to:   { description: "終了日 YYYYMMDD", required: true, default: "20261022" }
permissions: { contents: write }
concurrency: { group: boatev-db, cancel-in-progress: false }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: { PYTHONPATH: src, TZ: Asia/Tokyo }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && mkdir -p docs/data/logs && echo "=== $(date "+%F %T") ${{ github.workflow }} run ${{ github.run_id }}" >> docs/data/logs/backfill-odds.log
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
          restore-keys: boatev-db-
      - run: python -m boatev.cli backfill-odds --from ${{ inputs.from }} --to ${{ inputs.to }} --max-minutes 320 2>&1 | tee -a docs/data/logs/backfill-odds.log
      - run: python -m boatev.cli status 2>&1 | tee -a docs/data/logs/backfill-odds.log
        if: always()
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
      - name: commit
        if: always()
        run: |
          tail -n 400 docs/data/logs/backfill-odds.log > /tmp/l && mv /tmp/l docs/data/logs/backfill-odds.log
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data && git commit -m "backfill odds status" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done; echo "push failed"; exit 1
