# 毎日深夜：前日の確定データ（成績・確定オッズ）を蓄積。日曜は再学習＋バックテスト
name: nightly
on:
  schedule: [{ cron: "30 15 * * *" }]   # JST 0:30
  workflow_dispatch:
concurrency: { group: boatev-db, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { PYTHONPATH: src, TZ: Asia/Tokyo }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && mkdir -p docs/data/logs && echo "=== $(date "+%F %T") ${{ github.workflow }} run ${{ github.run_id }}" >> docs/data/logs/nightly.log
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
          restore-keys: boatev-db-
      - name: collect yesterday
        run: |
          Y=$(date -d yesterday +%Y%m%d)
          python -m boatev.cli history --from $Y --to $Y 2>&1 | tee -a docs/data/logs/nightly.log
          # 公式サイトはActionsから1アクセス約9秒かかるため、成績はK/Bファイルから取り、サイトからは3連単オッズだけ取る
          python -m boatev.cli backfill-odds --from $Y --to $Y --kinds 3t --max-minutes 90 2>&1 | tee -a docs/data/logs/nightly.log
          python -m boatev.cli results --date $Y 2>&1 | tee -a docs/data/logs/nightly.log
      - name: weekly retrain
        run: |
          [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || exit 0
          python -m boatev.cli train 2>&1 | tee -a docs/data/logs/nightly.log
          python -m boatev.cli backtest --test-from $(date -d '90 days ago' +%Y%m%d) 2>&1 | tee -a docs/data/logs/nightly.log || true
      - run: python -m boatev.cli status 2>&1 | tee -a docs/data/logs/nightly.log
        if: always()
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
      - name: commit
        if: always()
        run: |
          tail -n 400 docs/data/logs/nightly.log > /tmp/l && mv /tmp/l docs/data/logs/nightly.log
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data && git commit -m "nightly $(date +%Y%m%d)" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done; echo "push failed"; exit 1
      - name: start live
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" -d '{"ref":"main"}'
