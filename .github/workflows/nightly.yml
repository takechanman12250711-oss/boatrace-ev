# 毎日深夜：前日の確定データ（成績・確定オッズ）を蓄積。日曜は再学習＋バックテスト
name: nightly
on:
  schedule: [{ cron: "30 15 * * *" }]   # JST 0:30
  workflow_dispatch:
concurrency: { group: boatev-db, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { PYTHONPATH: src, TZ: Asia/Tokyo }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
          restore-keys: boatev-db-
      - name: collect yesterday
        run: |
          Y=$(date -d yesterday +%Y%m%d)
          python -m boatev.cli history --from $Y --to $Y
          python -m boatev.cli collect --date $Y
          python -m boatev.cli results --date $Y
      - name: weekly retrain
        run: |
          [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || exit 0
          python -m boatev.cli train
          python -m boatev.cli backtest --test-from $(date -d '90 days ago' +%Y%m%d) || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
      - name: commit
        run: |
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data && git commit -m "nightly $(date +%Y%m%d)" && git pull --rebase && git push || echo "no changes"
