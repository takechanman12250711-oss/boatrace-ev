# 開催時間中10分おき：締切20分以内のレースを予想 → 終わったレースの結果を反映
name: live predict
on:
  schedule: [{ cron: "*/10 0-12 * * *" }]   # JST 9:00〜21:59
  workflow_dispatch:
concurrency: { group: boatev-db, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: { PYTHONPATH: src, TZ: Asia/Tokyo }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
          restore-keys: boatev-db-
      - id: ready
        run: |
          if [ -f data/model.pkl ]; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "モデル未作成のためスキップ（先に setup を実行）"; fi
      - if: steps.ready.outputs.ok == '1'
        run: python -m boatev.cli predict --within 20
      - if: steps.ready.outputs.ok == '1'
        run: python -m boatev.cli results
      - uses: actions/cache/save@v4
        if: always() && steps.ready.outputs.ok == '1'
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
      - name: commit
        run: |
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data && git commit -m "predict $(date +%H:%M)" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done; echo "push failed"; exit 1
