# 開催時間中10分おき：締切20分以内のレースを予想 → 終わったレースの結果を反映
name: live predict
on:
  schedule: [{ cron: "*/10 0-12 * * *" }]   # JST 9:00〜21:59
  workflow_dispatch:
concurrency: { group: boatev-db, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: { PYTHONPATH: src, TZ: Asia/Tokyo }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
          restore-keys: boatev-db-
      - run: test -f data/model.pkl || (echo "先に setup を実行してください" && exit 1)
      - run: python -m boatev.cli predict --within 20
      - run: python -m boatev.cli results
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
      - name: commit
        run: |
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data && git commit -m "predict $(date +%H:%M)" && git pull --rebase && git push || echo "no changes"
