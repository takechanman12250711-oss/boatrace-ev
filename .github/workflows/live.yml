# 予想のリレー実行。GitHubの予約実行（cron）は遅れたり動かなかったりするため、
# 実行の終わりに「次の実行」を自分で起動してつなぐ。
#   夜（22時〜8時50分）: 待機 → 時間になったら次の実行を起動
#   昼（8時50分〜22時）: 約3分おきに予想と結果反映 → 22時になったら nightly を起動
#   nightly の最後に、また live を起動する（毎日これで一周する）
name: live predict
on:
  workflow_dispatch:
concurrency: { group: boatev-db, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env: { PYTHONPATH: src, TZ: Asia/Tokyo, PYTHONWARNINGS: ignore, GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && mkdir -p docs/data/logs
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
          restore-keys: boatev-db-
      - name: loop
        id: loop
        run: |
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          LOG=docs/data/logs/live.log
          end=$(( $(date +%s) + 335*60 ))
          echo "=== $(date '+%F %T') live run ${{ github.run_id }} 開始" >> $LOG
          next=live
          while [ "$(date +%s)" -lt "$end" ]; do
            hm=$(date +%H%M)
            if [ "$hm" -ge 2200 ]; then next=nightly; break; fi
            if [ "$hm" -lt 0850 ]; then sleep 300; continue; fi
            if [ -f data/model.pkl ]; then
              python -m boatev.cli predict --within 25 >> $LOG 2>&1 || echo "$(date '+%T') predict エラー" >> $LOG
              python -m boatev.cli results >> $LOG 2>&1 || echo "$(date '+%T') results エラー" >> $LOG
            fi
            tail -n 400 $LOG > /tmp/l && mv /tmp/l $LOG
            git add docs/data
            if git commit -qm "predict $(date +%H:%M)"; then
              for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -q -X theirs origin/main && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done
            fi
            sleep 180
          done
          echo "next=$next" >> $GITHUB_OUTPUT
          echo "=== $(date '+%F %T') 終了。次は $next" >> $LOG
          git add docs/data && git commit -qm "live end $(date +%H:%M)" && { for i in 1 2 3; do git fetch -q origin main && git rebase -q -X theirs origin/main && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done; } || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
      - name: start next run
        if: always()
        run: |
          W=${{ steps.loop.outputs.next || 'live' }}
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$W.yml/dispatches" -d '{"ref":"main"}'
          echo "started $W"
