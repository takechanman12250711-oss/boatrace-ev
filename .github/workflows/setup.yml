# 初回のみ手動実行：過去データ取込 → 学習 → バックテスト
name: setup (history + train)
on:
  workflow_dispatch:
    inputs:
      from: { description: "取込開始日 YYYYMMDD", required: true, default: "20250101" }
      to:   { description: "取込終了日 YYYYMMDD（空なら昨日）", required: false }
      test_from: { description: "バックテスト開始日 YYYYMMDD", required: true, default: "20260701" }
concurrency: { group: boatev-db, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env: { PYTHONPATH: src, TZ: Asia/Tokyo }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && mkdir -p docs/data/logs && echo "=== $(date "+%F %T") ${{ github.workflow }} run ${{ github.run_id }}" >> docs/data/logs/setup.log
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
          restore-keys: boatev-db-
      - name: history
        run: |
          TO="${{ inputs.to }}"; [ -z "$TO" ] && TO=$(date -d yesterday +%Y%m%d)
          python -m boatev.cli history --from ${{ inputs.from }} --to $TO --max-minutes 240 2>&1 | tee -a docs/data/logs/setup.log
      - run: python -m boatev.cli compare-features --from 20240101 2>&1 | tee -a docs/data/logs/setup.log || true
      - run: python -m boatev.cli train 2>&1 | tee -a docs/data/logs/setup.log
      - run: python -m boatev.cli backtest --test-from ${{ inputs.test_from }} 2>&1 | tee -a docs/data/logs/setup.log || true
      - run: python -m boatev.cli status 2>&1 | tee -a docs/data/logs/setup.log
        if: always()
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: boatev-db-${{ github.run_id }}
      - name: commit report
        if: always()
        run: |
          tail -n 400 docs/data/logs/setup.log > /tmp/l && mv /tmp/l docs/data/logs/setup.log
          git config user.name "boatev-bot"; git config user.email "boatev-bot@users.noreply.github.com"
          git add docs/data && git commit -m "setup report" || { echo "no changes"; exit 0; }
          for i in 1 2 3 4 5; do git fetch -q origin main && git rebase -X theirs origin/main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done; echo "push failed"; exit 1
